# Build + teszt minden push / PR-en; `v*` tagnél a négy platform binárisaiból skill-csomag és GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,         target: aarch64-apple-darwin,       dir: darwin-arm64 }
          - { os: macos-15,         target: x86_64-apple-darwin,        dir: darwin-x86_64 }
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl,  dir: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, dir: linux-aarch64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     dir: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: clippy + test (natív target)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          cargo clippy --release --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --release --target ${{ matrix.target }}
      - name: build
        shell: bash
        env:
          # a binárisba ne égjen be a runner útvonala
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=callgraph
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: bináris összegyűjtése
        shell: bash
        run: |
          mkdir -p out/${{ matrix.dir }}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/callgraph$ext out/${{ matrix.dir }}/
          [[ "${{ runner.os }}" == macOS ]] && codesign -s - -f out/${{ matrix.dir }}/callgraph || true
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.dir }}
          path: out/
          retention-days: 1

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - name: skill-csomag
        run: bash tools/build-skill.sh
      - uses: actions/upload-artifact@v4
        with:
          name: callgraph-package
          path: dist/callgraph-*.tar.gz
          retention-days: 7
      - name: GitHub Release (csak tagnél)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/callgraph-*.tar.gz --title "${GITHUB_REF_NAME}" --generate-notes
