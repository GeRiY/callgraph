[package]
name = "callgraph"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "PHP projekt-gráf elemző (callgraph Rust-port), JSONL kimenettel"

[lib]
name = "callgraph"
path = "src/lib.rs"

[[bin]]
name = "callgraph"
path = "src/main.rs"

[dependencies]
# gyors, szálbiztos allokátor: a musl beépített malloc-ja párhuzamos (rayon) terhelésnél szűk keresztmetszet
mimalloc = { version = "=0.1.52", default-features = false }
mago-syntax = "=1.59.0"
mago-allocator = "=1.59.0"
mago-database = "=1.59.0"
mago-span = "=1.59.0"
jsonc-parser = "=0.34.0"
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_syntax = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"
pulldown-cmark = "=0.13.0"
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
raffia = "=0.13.0"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# projekt-gráf tárolása (.callgraph/): MessagePack (önleíró, a FileGraph opcionális mezőivel is pontos) + LZ4, tiszta Rust
rmp-serde = "=1.3.1"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
thiserror = "2"
tree-sitter = "=0.27.1"
tree-sitter-swift = "=0.7.4"
# MCP-szerver (`callgraph mcp`): a hivatalos Rust SDK, csak szerver + stdio + makrók; tokio minimális funkciókkal
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
# MCP-fájlfigyelő (`graph::watch`): macOS FSEvents, Linux inotify, Windows ReadDirectoryChangesW; a mago-database
# is ezt a verziót használja, így nem kerül be új crate
notify = "=8.2.1"
# a bejárás .gitignore- és .callgraphignore-mintái (git-szemantika: `ignore::gitignore`); már eddig is a függőségi
# fában volt (a Cargo.lock-ban), így nem kerül be új crate
ignore = "=0.4.34"
# self-update: pure-Rust HTTPS (rustls, no OpenSSL) and zip (deflate only)
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
# self-update: SHA-256 of the downloaded package (SHA256SUMS), pure Rust
sha2 = { version = "=0.11.1", default-features = false }
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
