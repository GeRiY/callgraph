# Build + teszt minden push / PR-en; `v*` tagnél a négy platform binárisaiból skill-csomag és GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,         target: aarch64-apple-darwin,       dir: darwin-arm64 }
          - { os: macos-15,         target: x86_64-apple-darwin,        dir: darwin-x86_64 }
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl,  dir: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, dir: linux-aarch64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     dir: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      # musl-tools: natív musl-gcc. A C-kódos crate-ek (tree-sitter, ring) cc-je aarch64-en a nem létező
      # `aarch64-linux-musl-gcc`-t keresné (x86_64-en a musl-gcc-t magától megtalálja) — ezért explicit CC.
      - name: musl-tools
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          t="${{ matrix.target }}"
          echo "CC_${t//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: clippy + test (natív target)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          cargo clippy --release --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --release --target ${{ matrix.target }}
      - name: build
        shell: bash
        # a binárisba ne égjen be a runner útvonala (home: cargo registry; workspace: a mi forrásunk — az utolsó egyező nyer)
        run: |
          home="$HOME"; [[ "$RUNNER_OS" == Windows ]] && home="$USERPROFILE"
          export RUSTFLAGS="--remap-path-prefix=$home=~ --remap-path-prefix=$GITHUB_WORKSPACE=callgraph"
          cargo build --release --locked --target ${{ matrix.target }}
      - name: bináris összegyűjtése
        shell: bash
        run: |
          mkdir -p out/${{ matrix.dir }}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/callgraph$ext out/${{ matrix.dir }}/
          [[ "${{ runner.os }}" == macOS ]] && codesign -s - -f out/${{ matrix.dir }}/callgraph || true
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.dir }}
          path: out/
          retention-days: 1
      # a letölthető, telepíthető csomag: skill-fájlok + útmutató + ennek a platformnak a binárisa
      - name: telepíthető csomag
        shell: bash
        run: |
          p=pkg/callgraph
          mkdir -p $p/bin
          cp skill/SKILL.md skill/README.md skill/TELEPITES.md skill/*.sh LICENSE $p/
          cp -R skill/extras $p/extras
          cp -R skill/help $p/help
          cp -R out/${{ matrix.dir }} $p/bin/
      - uses: actions/upload-artifact@v4
        with:
          name: callgraph-${{ matrix.dir }}
          path: pkg/
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - name: skill-csomag
        run: bash tools/build-skill.sh
      - uses: actions/upload-artifact@v4
        with:
          name: callgraph-package
          path: dist/callgraph-*.tar.gz
          retention-days: 7
      # a platformonkénti telepíthető csomagok (callgraph-<os>-<arch>) → fix nevű zipek a Release-hez,
      # hogy a README releases/latest/download/callgraph-<os>-<arch>.zip linkjei mindig a legfrissebbre mutassanak
      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          pattern: callgraph-*-*
          path: dist/pkg
      - name: platform-zipek
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for d in dist/pkg/callgraph-*; do
            n="$(basename "$d")"
            (cd "$d" && zip -qr "../../$n.zip" callgraph)
          done
          ls -l dist/*.zip
      - name: GitHub Release (csak tagnél)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/callgraph-*.tar.gz dist/callgraph-*.zip --title "${GITHUB_REF_NAME}" --generate-notes
