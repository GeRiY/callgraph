# Build + teszt a main- és develop-pushoknál és PR-en; `v*` tagnél a négy platform binárisaiból skill-csomag és GitHub Release.
# develop-pushnál ugyanezek a csomagok a gördülő `dev` előzetes kiadásba kerülnek (a `dev` tag az épített commitra
# mozdul; `callgraph.sh update --dev`), a binárisok verziója `X.Y.Z-dev.<sha7>` (CALLGRAPH_BUILD_VERSION).
# A `dev` tag pusholása nem indít új futást: a tag-szűrő `v*`, és a GITHUB_TOKEN-nel küldött push amúgy sem indít workflow-t.
name: build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
    # csak dokumentáció változott → nincs build (a tag-pusholásra a paths-ignore nem vonatkozik)
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]

# egymás utáni pusholásnál a régi futás leáll; a release-t készítő tag-futás soha
concurrency:
  # a `-2` utótag: a beragadt (soha el nem induló) régi futások ne foglalják a csoportot
  group: build-2-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,         target: aarch64-apple-darwin,       dir: darwin-arm64 }
          - { os: macos-15,         target: x86_64-apple-darwin,        dir: darwin-x86_64 }
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl,  dir: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, dir: linux-aarch64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     dir: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      # a függőségek fordítása (target/) cache-ben platformonként: nem fordul le minden futásnál újra a ~300 crate
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # musl-tools: natív musl-gcc. A C-kódos crate-ek (tree-sitter, ring) cc-je aarch64-en a nem létező
      # `aarch64-linux-musl-gcc`-t keresné (x86_64-en a musl-gcc-t magától megtalálja) — ezért explicit CC.
      - name: musl-tools
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          # a runnerek apt-tükre néha átmenetileg nem érhető el (DNS): három próba, köztük szünet
          for try in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools && break
            [ "$try" = 3 ] && exit 1
            sleep 30
          done
          t="${{ matrix.target }}"
          echo "CC_${t//-/_}=musl-gcc" >> "$GITHUB_ENV"
      # debug profillal (LTO nélkül): a tesztekhez nem kell a release-optimalizálás; a kiadott bináris lent, release+LTO
      - name: clippy + test (natív target)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --target ${{ matrix.target }}
      - name: build
        shell: bash
        # a binárisba ne égjen be a runner útvonala (home: cargo registry; workspace: a mi forrásunk — az utolsó egyező nyer)
        run: |
          home="$HOME"; [[ "$RUNNER_OS" == Windows ]] && home="$USERPROFILE"
          export RUSTFLAGS="--remap-path-prefix=$home=~ --remap-path-prefix=$GITHUB_WORKSPACE=callgraph"
          # a C-kódos crate-ek (tree-sitter, ring) assert()-jei a __FILE__-lal a teljes forrásutat égetnék be:
          # gcc/clang-on átírjuk, MSVC-n (nincs file-prefix-map) NDEBUG-gal kivesszük az assert-eket
          if [[ "$RUNNER_OS" == Windows ]]; then
            export CFLAGS="/DNDEBUG"
          else
            export CFLAGS="-ffile-prefix-map=$home=~ -ffile-prefix-map=$GITHUB_WORKSPACE=callgraph"
          fi
          # develop-push (dev-csatorna): a bináris verziója X.Y.Z-dev.<sha7> (`callgraph --version`, a frissítő
          # ehhez hasonlít); tag-, main- és PR-buildnél nincs beállítva → a Cargo.toml verziója
          if [[ "${{ github.event_name }}" == push && "${{ github.ref }}" == refs/heads/develop ]]; then
            base="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
            export CALLGRAPH_BUILD_VERSION="$base-dev.${GITHUB_SHA::7}"
            echo "CALLGRAPH_BUILD_VERSION=$CALLGRAPH_BUILD_VERSION"
          fi
          cargo build --release --locked --target ${{ matrix.target }}
      - name: bináris összegyűjtése
        shell: bash
        run: |
          mkdir -p out/${{ matrix.dir }}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/callgraph$ext out/${{ matrix.dir }}/
          [[ "${{ runner.os }}" == macOS ]] && codesign -s - -f out/${{ matrix.dir }}/callgraph || true
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.dir }}
          path: out/
          retention-days: 1
      # a letölthető, telepíthető csomag: skill-fájlok + útmutató + ennek a platformnak a binárisa
      - name: telepíthető csomag
        shell: bash
        run: |
          p=pkg/callgraph
          mkdir -p $p/bin
          cp skill/SKILL.md skill/README.md skill/TELEPITES.md skill/*.sh LICENSE $p/
          cp -R skill/extras $p/extras
          cp -R skill/skill-i18n $p/skill-i18n
          cp -R skill/help $p/help
          cp -R out/${{ matrix.dir }} $p/bin/
      - uses: actions/upload-artifact@v4
        with:
          name: callgraph-${{ matrix.dir }}
          path: pkg/
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-24.04
    env:
      # 'true': v* tag (GitHub Release) vagy develop-push (dev előzetes kiadás) → platform-zipek + SHA256SUMS
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - name: skill-csomag
        run: bash tools/build-skill.sh
      - uses: actions/upload-artifact@v4
        with:
          name: callgraph-package
          path: dist/callgraph-*.tar.gz
          retention-days: 7
      # a platformonkénti telepíthető csomagok (callgraph-<os>-<arch>) → fix nevű zipek a Release-hez,
      # hogy a README releases/latest/download/callgraph-<os>-<arch>.zip linkjei mindig a legfrissebbre mutassanak
      - uses: actions/download-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          pattern: callgraph-*-*
          path: dist/pkg
      - name: platform-zipek
        if: env.PUBLISH == 'true'
        run: |
          for d in dist/pkg/callgraph-*; do
            n="$(basename "$d")"
            # az upload-artifact elveszíti a futtatási jogot: kézi kicsomagolásnál is induljon (az install.sh is beállítja)
            chmod +x "$d"/callgraph/*.sh "$d"/callgraph/bin/*/callgraph 2>/dev/null || true
            (cd "$d" && zip -qr "../../$n.zip" callgraph)
          done
          ls -l dist/*.zip
      # a frissítő (self-update) ezzel ellenőrzi a letöltött zipet; `sha256sum -c SHA256SUMS` kézzel is
      - name: SHA256SUMS
        if: env.PUBLISH == 'true'
        run: |
          cd dist
          sha256sum callgraph-*.tar.gz callgraph-*.zip > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      # MCPB-csomag (az összes platform binárisa + manifest) a hivatalos MCP Registry-hez; develop-pushnál csak
      # elkészül (a build-script tesztje), a release-be csak tagnél kerül. A SHA256SUMS-ba nem kerül (a self-update
      # azt ellenőrzi, az MCPB hash-e a server.json-ba megy).
      - name: MCPB-csomag
        if: env.PUBLISH == 'true'
        run: bash tools/build-mcpb.sh
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: callgraph-mcpb
          path: dist/callgraph.mcpb
          retention-days: 1
      - name: GitHub Release (csak tagnél)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/callgraph-*.tar.gz dist/callgraph-*.zip dist/SHA256SUMS dist/callgraph.mcpb --title "${GITHUB_REF_NAME}" --generate-notes
      # Dev-csatorna: develop-pushnál ugyanezek a fájlok (azonos nevek, azonos SHA256SUMS) a gördülő `dev` előzetes
      # kiadásba. Sorrend: tag mozgatása → kiadás létrehozása, ha nincs → feltöltés (--clobber) → elavult assetek
      # törlése → végül a leírás (benne a `version:` sor) frissítése: a kliens a leírásból olvassa a verziót, így az
      # új verziót csak akkor látja, amikor már minden új fájl fent van. Soha nem „latest”: a releases/latest marad
      # a legutóbbi stabil. A `dev` tag pusholása nem indít új futást (tag-szűrő: `v*`; GITHUB_TOKEN-es push).
      - name: dev előzetes kiadás (csak develop-pushnál)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          version="$base-dev.${GITHUB_SHA::7}"
          echo "$version" > dist/VERSION
          notes="$(printf '%s\n' \
            "Rolling development build of the \`develop\` branch — not a stable release, may be unstable." \
            "Install: \`bash ~/.claude/skills/callgraph/callgraph.sh update --dev\`" \
            "" \
            "version: $version" \
            "commit: $GITHUB_SHA" \
            "date: $(date -u +%Y-%m-%d)")"
          title="callgraph dev (develop)"
          git tag -f dev "$GITHUB_SHA"
          git push -f origin refs/tags/dev
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --verify-tag --prerelease --latest=false --title "$title" --notes "$notes"
          fi
          files=(dist/callgraph-*.tar.gz dist/callgraph-*.zip dist/SHA256SUMS dist/VERSION)
          gh release upload dev "${files[@]}" --clobber
          # elavult assetek (pl. egy régebbi verziószámú callgraph-X.Y.Z.tar.gz) törlése
          keep="$(printf '%s\n' "${files[@]##*/}")"
          gh release view dev --json assets --jq '.assets[].name' | while read -r name; do
            grep -qxF "$name" <<<"$keep" || gh release delete-asset dev "$name" --yes
          done
          gh release edit dev --prerelease --latest=false --title "$title" --notes "$notes"
          gh release view dev

  # Hivatalos MCP Registry (registry.modelcontextprotocol.io): tagnél a release-be feltöltött callgraph.mcpb-vel
  # frissíti az io.github.GeRiY/callgraph bejegyzést. Hitelesítés GitHub OIDC-vel (a repó saját futása igazolja
  # a GeRiY névteret), titok nem kell. A mcp-publisher verziója rögzített, a letöltését Sigstore-ral ellenőrizzük.
  mcp-registry:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: callgraph-mcpb
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: mcp-publisher letöltése és ellenőrzése
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: server.json kitöltése (verzió, letöltési URL, SHA-256)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha="$(sha256sum dist/callgraph.mcpb | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/callgraph.mcpb"
          jq --arg v "$version" --arg u "$url" --arg s "$sha" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      - name: közzététel
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
