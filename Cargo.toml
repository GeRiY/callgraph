[package]
name = "callgraph"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PHP projekt-gráf elemző (callgraph Rust-port), JSONL kimenettel"

[lib]
name = "callgraph"
path = "src/lib.rs"

[[bin]]
name = "callgraph"
path = "src/main.rs"

[dependencies]
mago-syntax = "=1.59.0"
mago-allocator = "=1.59.0"
mago-database = "=1.59.0"
mago-span = "=1.59.0"
jsonc-parser = "=0.34.0"
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_syntax = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"
pulldown-cmark = "=0.13.0"
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
raffia = "=0.13.0"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
thiserror = "2"
tree-sitter = "=0.27.1"
tree-sitter-swift = "=0.7.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
